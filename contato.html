<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Entre em contato com a RFLP."
>

<title>RFLP | Contato</title>

<link rel="stylesheet" href="style.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

</head>

<body>

<!-- =========================
     CENA 3D
========================== -->

<div class="scene">

    <div class="grid-floor"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>

    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    <div class="particle particle-4"></div>
    <div class="particle particle-5"></div>

</div>


<!-- MARCA D'ÁGUA -->

<div class="watermark">

    <img
        src="Meulogo.png"
        alt=""
    >

</div>


<!-- =========================
     HEADER
========================== -->

<header class="header">

    <a href="/" class="logo">
        RFLP
    </a>

    <nav class="menu">

        <a href="/" class="active">
            Início
        </a>

        <a href="/sobre">
            Sobre
        </a>

        <a href="/contato">
            Contato
        </a>

    </nav>

</header>


<!-- =========================
     CONTATO
========================== -->

<main class="contact">


    <!-- =========================
         INFORMAÇÕES
    ========================== -->

    <section class="contact-content reveal">

        <span class="subtitle">
            CONTATO
        </span>


        <h1>

            Vamos criar algo
            <span>
                incrível.
            </span>

        </h1>


        <p>

            Tem uma ideia ou precisa de um
            site profissional para o seu negócio?
            Entre em contato comigo.

        </p>


        <!-- LINKS -->

        <div class="contact-links">


            <!-- WHATSAPP -->

            <a
                href="https://wa.me/5511945220806"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-item"
                data-tilt
            >

                <div class="contact-icon">

                    <i class="fa-brands fa-whatsapp"></i>

                </div>


                <div>

                    <small>
                        WHATSAPP
                    </small>

                    <strong>
                        Fale comigo
                    </strong>

                </div>

            </a>


            <!-- E-MAIL -->

            <a
                href="mailto:rfirminof.93@gmail.com"
                class="contact-item"
                data-tilt
            >

                <div class="contact-icon">

                    <i class="fa-solid fa-envelope"></i>

                </div>


                <div>

                    <small>
                        E-MAIL
                    </small>

                    <strong>
                        rfirminof.93@gmail.com
                    </strong>

                </div>

            </a>


            <!-- INSTAGRAM -->

            <a
                href="https://www.instagram.com/irobsonf23_/"
                target="_blank"
                rel="noopener noreferrer"
                class="contact-item"
                data-tilt
            >

                <div class="contact-icon">

                    <i class="fa-brands fa-instagram"></i>

                </div>


                <div>

                    <small>
                        INSTAGRAM
                    </small>

                    <strong>
                        Siga meu trabalho
                    </strong>

                </div>

            </a>

        </div>

    </section>


    <!-- =========================
         FORMULÁRIO
    ========================== -->

    <section
        class="contact-form-area reveal delay-1"
    >

        <div class="form-glow"></div>


        <form id="contactForm">


            <label for="name">
                Nome
            </label>


            <input
                type="text"
                id="name"
                placeholder="Seu nome"
                required
            >


            <label for="email">
                E-mail
            </label>


            <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                required
            >


            <label for="message">
                Mensagem
            </label>


            <textarea
                id="message"
                rows="6"
                placeholder="Conte um pouco sobre seu projeto..."
                required
            ></textarea>


            <button
                type="submit"
                class="btn primary"
            >
                Enviar pelo WhatsApp
            </button>


        </form>

    </section>

</main>


<!-- =========================
     FOOTER
========================== -->

<footer>

    <span>
        © 2026 RFLP
    </span>

    <span>
        WEB DESIGNER
    </span>

</footer>


<script src="javascript.js"></script>

</body>

</html>
