<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="RFLP - Desenvolvimento de sites modernos, profissionais e responsivos."
    >
    <link rel="icon" type="image/png" href="Meulogo.png">
    <title>RFLP | Web Designer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         FUNDO 3D
    ========================== -->

    <div class="scene">

        <div class="grid-floor"></div>

        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>

        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="particle particle-4"></div>
        <div class="particle particle-5"></div>

    </div>


    <!-- =========================
         MARCA D'ÁGUA
    ========================== -->

    <div class="watermark">

        <img
            src="Meulogo.png"
            alt=""
        >

    </div>


<!-- =========================
     HEADER
========================== -->

<header class="header">

    <a href="/" class="logo">
        RFLP
    </a>

    <nav class="menu">

        <a href="/">
            Início
        </a>

        <a href="/sobre">
            Sobre
        </a>

        <a href="/contato">
            Contato
        </a>

    </nav>

</header>


    <!-- =========================
         HERO
    ========================== -->

    <main class="hero">

        <div class="hero-content">

            <span class="subtitle reveal">
                WEB DESIGNER
            </span>


            <h1 class="reveal delay-1">

                Transformando

                <span>
                    ideias
                </span>

                em sites.

            </h1>


            <p class="reveal delay-2">

                Criação de sites modernos,
                profissionais, responsivos e
                personalizados para destacar
                sua marca na internet.

            </p>


            <div class="buttons reveal delay-3">

                <a
                    href="sobre.html"
                    class="btn primary"
                >
                    Conheça meu trabalho
                </a>


                <a
                    href="contato.html"
                    class="btn secondary"
                >
                    Entrar em contato
                </a>

            </div>

        </div>


        <!-- =========================
             OBJETO 3D PRINCIPAL
        ========================== -->

        <div
            class="hero-3d"
            id="hero3d"
        >

            <div class="orbit orbit-one"></div>

            <div class="orbit orbit-two"></div>

            <div class="orbit orbit-three"></div>


            <div class="logo-3d">

                <div class="logo-glow"></div>

                <div class="logo-inner">

                    <img
                        src="Meulogo.png"
                        alt="Logo RFLP"
                    >

                </div>

            </div>


            <div class="floating-card card-one">
                HTML
            </div>

            <div class="floating-card card-two">
                CSS
            </div>

            <div class="floating-card card-three">
                JS
            </div>

        </div>

    </main>


    <!-- =========================
         INDICADOR
    ========================== -->

    <div class="scroll-indicator">

        <span>
            SCROLL
        </span>

        <div></div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <span>
            © 2026 RFLP
        </span>

        <span>
            WEB DESIGNER
        </span>

    </footer>


    <script src="javascript.js"></script>

</body>

</html>
